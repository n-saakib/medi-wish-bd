name: medi-wish-optional
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medi_wish_container}
      POSTGRES_USER: ${POSTGRES_USER:-medi_wish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        BACKEND_JAR: ${BACKEND_JAR:-backend/target/medi-wish.jar}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-medi_wish_container}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-medi_wish}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8081}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_started
volumes:
  postgres-data:
