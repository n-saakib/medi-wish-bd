databaseChangeLog:
  - changeSet:
      id: 001-foundation
      author: medi-wish
      changes:
        - tagDatabase:
            tag: application-baseline
  - changeSet:
      id: 002-customers
      author: medi-wish
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: mobile
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: VARCHAR(320)
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: mobile_verified
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueDate: now()
                  constraints:
                    nullable: false
  - changeSet:
      id: 003-customer-java-owned-values
      author: medi-wish
      changes:
        - dropDefaultValue:
            tableName: customers
            columnName: id
            columnDataType: UUID
        - dropDefaultValue:
            tableName: customers
            columnName: created_at
            columnDataType: TIMESTAMP WITH TIME ZONE
  - changeSet:
      id: 004-shared-users-and-roles
      author: medi-wish
      changes:
        - renameTable:
            oldTableName: customers
            newTableName: users
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role
            constraintName: pk_user_roles
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user
            onDelete: CASCADE
        - sql:
            sql: INSERT INTO user_roles (user_id, role) SELECT id, 'CUSTOMER' FROM users
  - changeSet:
      id: 005-user-password-sessions
      author: medi-wish
      changes:
        - createTable:
            tableName: user_sessions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_used_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: revoked_reason
                  type: VARCHAR(64)
        - addForeignKeyConstraint:
            baseTableName: user_sessions
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_sessions_user
            onDelete: CASCADE
        - createIndex:
            tableName: user_sessions
            indexName: idx_user_sessions_user_revoked
            columns:
              - column:
                  name: user_id
              - column:
                  name: revoked_at
        - createIndex:
            tableName: user_sessions
            indexName: idx_user_sessions_expires
            columns:
              - column:
                  name: expires_at
        - createTable:
            tableName: user_session_refresh_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: session_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: generation
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: issued_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: TIMESTAMP WITH TIME ZONE
        - addForeignKeyConstraint:
            baseTableName: user_session_refresh_tokens
            baseColumnNames: session_id
            referencedTableName: user_sessions
            referencedColumnNames: id
            constraintName: fk_session_refresh_tokens_session
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: user_session_refresh_tokens
            columnNames: session_id, generation
            constraintName: uk_session_refresh_generation
        - createIndex:
            tableName: user_session_refresh_tokens
            indexName: idx_session_refresh_session_expires
            columns:
              - column:
                  name: session_id
              - column:
                  name: expires_at
  - changeSet:
      id: 006-user-email-lookup
      author: medi-wish
      changes:
        - createIndex:
            tableName: users
            indexName: idx_users_email
            columns:
              - column:
                  name: email
  - changeSet:
      id: 007-user-email-case-insensitive-lookup
      author: medi-wish
      changes:
        - sql:
            sql: CREATE INDEX idx_users_email_upper ON users (upper(email))
  - changeSet:
      id: 008-drop-unused-exact-email-index
      author: medi-wish
      changes:
        - dropIndex:
            tableName: users
            indexName: idx_users_email
