databaseChangeLog:
  - changeSet:
      id: 001-foundation
      author: medi-wish
      changes:
        - tagDatabase:
            tag: application-baseline
  - changeSet:
      id: 002-customers
      author: medi-wish
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: mobile
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: VARCHAR(320)
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: mobile_verified
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueDate: now()
                  constraints:
                    nullable: false
  - changeSet:
      id: 003-customer-java-owned-values
      author: medi-wish
      changes:
        - dropDefaultValue:
            tableName: customers
            columnName: id
            columnDataType: UUID
        - dropDefaultValue:
            tableName: customers
            columnName: created_at
            columnDataType: TIMESTAMP WITH TIME ZONE
  - changeSet:
      id: 004-shared-users-and-roles
      author: medi-wish
      changes:
        - renameTable:
            oldTableName: customers
            newTableName: users
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role
            constraintName: pk_user_roles
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user
            onDelete: CASCADE
        - sql:
            sql: INSERT INTO user_roles (user_id, role) SELECT id, 'CUSTOMER' FROM users
  - changeSet:
      id: 005-user-password-sessions
      author: medi-wish
      changes:
        - createTable:
            tableName: user_sessions
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: last_used_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: revoked_reason
                  type: VARCHAR(64)
        - addForeignKeyConstraint:
            baseTableName: user_sessions
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_sessions_user
            onDelete: CASCADE
        - createIndex:
            tableName: user_sessions
            indexName: idx_user_sessions_user_revoked
            columns:
              - column:
                  name: user_id
              - column:
                  name: revoked_at
        - createIndex:
            tableName: user_sessions
            indexName: idx_user_sessions_expires
            columns:
              - column:
                  name: expires_at
        - createTable:
            tableName: user_session_refresh_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: session_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: generation
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: issued_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: TIMESTAMP WITH TIME ZONE
        - addForeignKeyConstraint:
            baseTableName: user_session_refresh_tokens
            baseColumnNames: session_id
            referencedTableName: user_sessions
            referencedColumnNames: id
            constraintName: fk_session_refresh_tokens_session
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: user_session_refresh_tokens
            columnNames: session_id, generation
            constraintName: uk_session_refresh_generation
        - createIndex:
            tableName: user_session_refresh_tokens
            indexName: idx_session_refresh_session_expires
            columns:
              - column:
                  name: session_id
              - column:
                  name: expires_at
  - changeSet:
      id: 006-user-email-lookup
      author: medi-wish
      changes:
        - createIndex:
            tableName: users
            indexName: idx_users_email
            columns:
              - column:
                  name: email
  - changeSet:
      id: 007-user-email-case-insensitive-lookup
      author: medi-wish
      changes:
        - sql:
            sql: CREATE INDEX idx_users_email_upper ON users (upper(email))
  - changeSet:
      id: 008-drop-unused-exact-email-index
      author: medi-wish
      changes:
        - dropIndex:
            tableName: users
            indexName: idx_users_email
  - changeSet:
      id: 009-unique-user-email
      author: medi-wish
      preConditions:
        - onFail: HALT
        - onFailMessage: >-
            Migration 009-unique-user-email stopped: some Users share an email ignoring case.
            Resolve the duplicate emails by hand, then rerun the migration.
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT count(*) FROM (SELECT 1 FROM users WHERE email IS NOT NULL
              GROUP BY upper(email) HAVING count(*) > 1) duplicate_emails
      changes:
        - dropIndex:
            tableName: users
            indexName: idx_users_email_upper
        - createIndex:
            tableName: users
            indexName: uk_users_email_upper
            unique: true
            columns:
              - column:
                  name: upper(email)
                  computed: true
  - changeSet:
      id: 010-staff-mfa
      author: medi-wish
      changes:
        - createTable:
            tableName: staff_mfa_factors
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_staff_mfa_factors_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: secret_ciphertext
                  type: BYTEA
                  constraints:
                    nullable: false
              - column:
                  name: secret_nonce
                  type: BYTEA
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: pending_expires_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: activated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_used_step
                  type: BIGINT
                  defaultValueNumeric: -1
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              ALTER TABLE staff_mfa_factors ADD CONSTRAINT ck_staff_mfa_factors_status
              CHECK (status IN ('PENDING', 'ACTIVE', 'REVOKED'))
        - sql:
            sql: CREATE UNIQUE INDEX uq_staff_mfa_active ON staff_mfa_factors (user_id) WHERE status = 'ACTIVE'
        - sql:
            sql: CREATE UNIQUE INDEX uq_staff_mfa_pending ON staff_mfa_factors (user_id) WHERE status = 'PENDING'
        - createTable:
            tableName: staff_mfa_backup_codes
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: factor_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_staff_mfa_backup_codes_factor
                    references: staff_mfa_factors(id)
                    deleteCascade: true
              - column:
                  name: code_verifier
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: consumed_at
                  type: TIMESTAMP WITH TIME ZONE
        - createIndex:
            tableName: staff_mfa_backup_codes
            indexName: idx_staff_mfa_backup_codes_factor
            columns:
              - column:
                  name: factor_id
        - createTable:
            tableName: staff_mfa_throttle
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_staff_mfa_throttle_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: failed_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: window_started_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: locked_until
                  type: TIMESTAMP WITH TIME ZONE
        - createTable:
            tableName: staff_bootstrap
            columns:
              - column:
                  name: id
                  type: SMALLINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: super_admin_user_id
                  type: UUID
              - column:
                  name: provisioned_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE staff_bootstrap ADD CONSTRAINT ck_staff_bootstrap_singleton CHECK (id = 1)
        - addForeignKeyConstraint:
            baseTableName: staff_bootstrap
            baseColumnNames: super_admin_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_staff_bootstrap_super_admin
            onDelete: SET NULL
        - createTable:
            tableName: security_audit_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: subject_user_id
                  type: UUID
              - column:
                  name: session_id
                  type: UUID
              - column:
                  name: request_id
                  type: VARCHAR(64)
        - addForeignKeyConstraint:
            baseTableName: security_audit_events
            baseColumnNames: subject_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_security_audit_events_subject
            onDelete: SET NULL
        - createIndex:
            tableName: security_audit_events
            indexName: idx_security_audit_events_subject
            columns:
              - column:
                  name: subject_user_id
              - column:
                  name: occurred_at
        - addColumn:
            tableName: user_sessions
            columns:
              - column:
                  name: mfa_factor_id
                  type: UUID
              - column:
                  name: mfa_verified_at
                  type: TIMESTAMP WITH TIME ZONE
        - addForeignKeyConstraint:
            baseTableName: user_sessions
            baseColumnNames: mfa_factor_id
            referencedTableName: staff_mfa_factors
            referencedColumnNames: id
            constraintName: fk_user_sessions_mfa_factor
            onDelete: SET NULL
  - changeSet:
      id: 011-staff-role-changes
      author: medi-wish
      preConditions:
        - onFail: HALT
        - onFailMessage: >-
            Migration 011-staff-role-changes stopped: user_roles contains an unknown role.
            Resolve the invalid role by hand, then rerun the migration.
        - sqlCheck:
            expectedResult: 0
            sql: SELECT count(*) FROM user_roles WHERE role NOT IN ('CUSTOMER', 'DELIVERY_PERSON', 'MODERATOR', 'ADMIN')
      changes:
        - sql:
            sql: >-
              DELETE FROM user_roles lower_role USING
              (SELECT user_id, max(CASE role WHEN 'CUSTOMER' THEN 0 WHEN 'DELIVERY_PERSON' THEN 1
              WHEN 'MODERATOR' THEN 2 WHEN 'ADMIN' THEN 3 END) AS rank FROM user_roles GROUP BY user_id) highest
              WHERE lower_role.user_id = highest.user_id AND
              (CASE lower_role.role WHEN 'CUSTOMER' THEN 0 WHEN 'DELIVERY_PERSON' THEN 1
              WHEN 'MODERATOR' THEN 2 WHEN 'ADMIN' THEN 3 END) < highest.rank
        - sql:
            sql: >-
              INSERT INTO user_roles(user_id, role) SELECT id, 'CUSTOMER' FROM users
              WHERE NOT EXISTS (SELECT 1 FROM user_roles WHERE user_id = users.id)
        - dropPrimaryKey:
            tableName: user_roles
            constraintName: pk_user_roles
        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id
            constraintName: pk_user_roles
        - sql:
            sql: >-
              ALTER TABLE user_roles ADD CONSTRAINT ck_user_roles_role
              CHECK (role IN ('CUSTOMER', 'DELIVERY_PERSON', 'MODERATOR', 'ADMIN'))
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION user_role_required() RETURNS trigger LANGUAGE plpgsql AS $role_required$
              DECLARE checked_user_id UUID;
              BEGIN
                IF TG_TABLE_NAME = 'users' THEN
                  checked_user_id := NEW.id;
                ELSE
                  checked_user_id := OLD.user_id;
                END IF;
                IF EXISTS (SELECT 1 FROM users WHERE id = checked_user_id)
                   AND NOT EXISTS (SELECT 1 FROM user_roles WHERE user_id = checked_user_id) THEN
                  RAISE EXCEPTION 'user_role_required: every User needs a role' USING ERRCODE = 'check_violation';
                END IF;
                RETURN NULL;
              END;
              $role_required$;
        - sql:
            sql: >-
              CREATE CONSTRAINT TRIGGER ctr_users_role_required AFTER INSERT OR UPDATE OF id ON users
              DEFERRABLE INITIALLY DEFERRED FOR EACH ROW EXECUTE FUNCTION user_role_required()
        - sql:
            sql: >-
              CREATE CONSTRAINT TRIGGER ctr_user_roles_role_required AFTER DELETE OR UPDATE OF user_id ON user_roles
              DEFERRABLE INITIALLY DEFERRED FOR EACH ROW EXECUTE FUNCTION user_role_required()
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: roles_version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - sql:
            sql: |
              CREATE TABLE user_role_changes (
                id UUID PRIMARY KEY,
                occurred_at TIMESTAMP WITH TIME ZONE NOT NULL,
                actor_user_id UUID REFERENCES users(id) ON DELETE SET NULL,
                target_user_id UUID REFERENCES users(id) ON DELETE SET NULL,
                old_role VARCHAR(32) NOT NULL,
                new_role VARCHAR(32) NOT NULL,
                request_id VARCHAR(64),
                CONSTRAINT ck_user_role_changes_old_role CHECK (old_role IN ('CUSTOMER', 'DELIVERY_PERSON', 'MODERATOR', 'ADMIN')),
                CONSTRAINT ck_user_role_changes_new_role CHECK (new_role IN ('CUSTOMER', 'DELIVERY_PERSON', 'MODERATOR', 'ADMIN')),
                CONSTRAINT ck_user_role_changes_changed CHECK (old_role <> new_role)
              )
        - sql:
            sql: CREATE INDEX ix_user_role_changes_target ON user_role_changes (target_user_id, occurred_at DESC)
  - changeSet:
      id: 012-user-profile
      author: medi-wish
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: full_name
                  type: VARCHAR(100)
              - column:
                  name: date_of_birth
                  type: DATE
              - column:
                  name: profile_version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: account_state
                  type: VARCHAR(24)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              ALTER TABLE users ADD CONSTRAINT ck_users_account_state
              CHECK (account_state IN ('ACTIVE', 'CLOSURE_REQUESTED'))
        - createTable:
            tableName: user_mobile_changes
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_user_mobile_changes_user
              - column:
                  name: new_mobile
                  type: VARCHAR(11)
                  constraints:
                    nullable: false
              - column:
                  name: requested_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_mobile_changes
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_mobile_changes_user
            onDelete: CASCADE
  - changeSet:
      id: 013-catalog
      author: medi-wish
      changes:
        - sql:
            splitStatements: true
            sql: |-
              CREATE TABLE product_categories (
                id UUID PRIMARY KEY,
                name VARCHAR(80) NOT NULL,
                active BOOLEAN NOT NULL DEFAULT TRUE,
                version BIGINT NOT NULL DEFAULT 0,
                created_at TIMESTAMPTZ NOT NULL,
                updated_at TIMESTAMPTZ NOT NULL,
                created_by UUID REFERENCES users(id) ON DELETE SET NULL,
                updated_by UUID REFERENCES users(id) ON DELETE SET NULL
              );
              CREATE UNIQUE INDEX uk_product_categories_name ON product_categories (lower(name));
              CREATE TABLE products (
                id UUID PRIMARY KEY,
                kind VARCHAR(16) NOT NULL CONSTRAINT ck_products_kind CHECK (kind IN ('MEDICINE','EQUIPMENT')),
                name VARCHAR(160) NOT NULL,
                brand_name VARCHAR(120),
                generic_name VARCHAR(200),
                manufacturer VARCHAR(120),
                dosage_form VARCHAR(120),
                sale_unit VARCHAR(80) NOT NULL,
                description VARCHAR(4000),
                category_id UUID NOT NULL REFERENCES product_categories(id) ON DELETE RESTRICT,
                selling_price NUMERIC(9,2) CONSTRAINT ck_products_selling_price_positive CHECK (selling_price > 0),
                mrp NUMERIC(9,2) CONSTRAINT ck_products_mrp_positive CHECK (mrp > 0),
                active BOOLEAN NOT NULL DEFAULT FALSE,
                require_validation BOOLEAN NOT NULL DEFAULT FALSE,
                version BIGINT NOT NULL DEFAULT 0,
                created_at TIMESTAMPTZ NOT NULL,
                updated_at TIMESTAMPTZ NOT NULL,
                created_by UUID REFERENCES users(id) ON DELETE SET NULL,
                updated_by UUID REFERENCES users(id) ON DELETE SET NULL,
                CONSTRAINT ck_products_price_le_mrp CHECK (mrp IS NULL OR selling_price IS NULL OR selling_price <= mrp),
                CONSTRAINT ck_products_active_priced CHECK (NOT active OR selling_price IS NOT NULL),
                CONSTRAINT ck_products_mrp_needs_price CHECK (mrp IS NULL OR selling_price IS NOT NULL),
                CONSTRAINT ck_products_medicine_fields CHECK (kind <> 'MEDICINE' OR (generic_name IS NOT NULL AND dosage_form IS NOT NULL)),
                CONSTRAINT ck_products_equipment_fields CHECK (kind <> 'EQUIPMENT' OR (generic_name IS NULL AND dosage_form IS NULL))
              );
              CREATE INDEX ix_products_category ON products (category_id);
              CREATE INDEX ix_products_name ON products (lower(name), id);
              CREATE TABLE product_changes (
                id UUID PRIMARY KEY,
                product_id UUID NOT NULL REFERENCES products(id) ON DELETE RESTRICT,
                occurred_at TIMESTAMPTZ NOT NULL,
                actor_user_id UUID REFERENCES users(id) ON DELETE SET NULL,
                change_type VARCHAR(32) NOT NULL CONSTRAINT ck_product_changes_type CHECK (change_type IN
                  ('CREATED','CATALOG_UPDATED','PRICE_CHANGED','REQUIRE_VALIDATION_CHANGED','ACTIVATED','DEACTIVATED')),
                old_selling_price NUMERIC(9,2),
                new_selling_price NUMERIC(9,2),
                old_mrp NUMERIC(9,2),
                new_mrp NUMERIC(9,2),
                old_require_validation BOOLEAN,
                new_require_validation BOOLEAN,
                request_id VARCHAR(64)
              );
              CREATE INDEX ix_product_changes_product ON product_changes (product_id, occurred_at DESC);

  - changeSet:
      id: 013-catalog-finite-money
      author: medi-wish
      changes:
        - sql:
            splitStatements: true
            sql: |-
              ALTER TABLE products ADD CONSTRAINT ck_products_selling_price_finite
                CHECK (selling_price <= 9999999.99);
              ALTER TABLE products ADD CONSTRAINT ck_products_mrp_finite
                CHECK (mrp <= 9999999.99);

  - changeSet:
      id: 014-role-required-search-path
      author: medi-wish
      changes:
        - sql:
            splitStatements: false
            sql: |-
              DO $pin_role_required$
              BEGIN
                EXECUTE format('ALTER FUNCTION %I.user_role_required() SET search_path = %I, pg_temp',
                  current_schema(), current_schema());
              END;
              $pin_role_required$;

  - changeSet:
      id: 015-product-images
      author: medi-wish
      changes:
        - sql:
            splitStatements: true
            sql: |-
              CREATE TABLE product_images (
                id UUID PRIMARY KEY,
                product_id UUID NOT NULL REFERENCES products(id) ON DELETE RESTRICT,
                object_key VARCHAR(120) NOT NULL CONSTRAINT uk_product_images_object_key UNIQUE,
                content_type VARCHAR(16) NOT NULL CONSTRAINT ck_product_images_content_type
                  CHECK (content_type IN ('image/jpeg', 'image/png')),
                byte_size INTEGER NOT NULL CONSTRAINT ck_product_images_byte_size CHECK (byte_size BETWEEN 1 AND 3145728),
                width INTEGER NOT NULL, height INTEGER NOT NULL,
                sha256 CHAR(64) NOT NULL CONSTRAINT ck_product_images_sha256 CHECK (sha256 ~ '^[0-9a-f]{64}$'),
                alt_text VARCHAR(160) CONSTRAINT ck_product_images_alt_text
                  CHECK (alt_text IS NULL OR (char_length(alt_text) >= 1 AND alt_text = btrim(alt_text))),
                display_order INTEGER NOT NULL CONSTRAINT ck_product_images_display_order CHECK (display_order BETWEEN 0 AND 7),
                version BIGINT NOT NULL DEFAULT 0 CONSTRAINT ck_product_images_version CHECK (version >= 0),
                created_at TIMESTAMPTZ NOT NULL, updated_at TIMESTAMPTZ NOT NULL,
                created_by UUID REFERENCES users(id) ON DELETE SET NULL,
                updated_by UUID REFERENCES users(id) ON DELETE SET NULL,
                CONSTRAINT ck_product_images_dimensions CHECK (width BETWEEN 1 AND 4096 AND height BETWEEN 1 AND 4096),
                CONSTRAINT ck_product_images_key_owner CHECK (object_key = 'products/' || product_id::text || '/' || id::text
                  || CASE content_type WHEN 'image/jpeg' THEN '.jpg' ELSE '.png' END),
                CONSTRAINT uk_product_images_order UNIQUE (product_id, display_order) DEFERRABLE INITIALLY DEFERRED
              );

              CREATE TABLE retired_product_image_ids (
                id UUID PRIMARY KEY,
                retired_at TIMESTAMPTZ NOT NULL
              );

  - changeSet:
      id: 016-discounts
      author: medi-wish
      changes:
        - sql:
            splitStatements: true
            sql: |-
              CREATE TABLE discounts (
                id UUID PRIMARY KEY,
                target_type VARCHAR(16) NOT NULL CONSTRAINT ck_discounts_target_type CHECK (target_type IN ('PRODUCT','CATEGORY')),
                product_id UUID REFERENCES products(id) ON DELETE RESTRICT,
                category_id UUID REFERENCES product_categories(id) ON DELETE RESTRICT,
                kind VARCHAR(16) NOT NULL CONSTRAINT ck_discounts_kind CHECK (kind IN ('PERCENTAGE','FLAT')),
                percent NUMERIC(4,2),
                amount NUMERIC(9,2),
                starts_on DATE NOT NULL,
                ends_on DATE,
                ended_at TIMESTAMPTZ,
                version BIGINT NOT NULL DEFAULT 0,
                created_at TIMESTAMPTZ NOT NULL,
                updated_at TIMESTAMPTZ NOT NULL,
                created_by UUID REFERENCES users(id) ON DELETE SET NULL,
                updated_by UUID REFERENCES users(id) ON DELETE SET NULL,
                CONSTRAINT ck_discounts_target CHECK (
                  (target_type = 'PRODUCT' AND product_id IS NOT NULL AND category_id IS NULL)
                  OR (target_type = 'CATEGORY' AND category_id IS NOT NULL AND product_id IS NULL)),
                CONSTRAINT ck_discounts_value CHECK (
                  (kind = 'PERCENTAGE' AND percent IS NOT NULL AND amount IS NULL)
                  OR (kind = 'FLAT' AND amount IS NOT NULL AND percent IS NULL)),
                CONSTRAINT ck_discounts_percent_range CHECK (percent >= 1 AND percent <= 99 AND percent = trunc(percent)),
                CONSTRAINT ck_discounts_amount_range CHECK (amount > 0 AND amount <= 9999999.99),
                CONSTRAINT ck_discounts_dates CHECK (ends_on IS NULL OR ends_on >= starts_on)
              );
              CREATE INDEX ix_discounts_product ON discounts (product_id) WHERE product_id IS NOT NULL;
              CREATE INDEX ix_discounts_category ON discounts (category_id) WHERE category_id IS NOT NULL;
              CREATE INDEX ix_discounts_starts ON discounts (starts_on, id);
              CREATE TABLE discount_changes (
                id UUID PRIMARY KEY,
                discount_id UUID NOT NULL REFERENCES discounts(id) ON DELETE RESTRICT,
                occurred_at TIMESTAMPTZ NOT NULL,
                actor_user_id UUID REFERENCES users(id) ON DELETE SET NULL,
                change_type VARCHAR(16) NOT NULL CONSTRAINT ck_discount_changes_type CHECK (change_type IN ('CREATED','UPDATED','ENDED')),
                kind VARCHAR(16) NOT NULL,
                percent NUMERIC(4,2),
                amount NUMERIC(9,2),
                starts_on DATE NOT NULL,
                ends_on DATE,
                request_id VARCHAR(64)
              );
              CREATE INDEX ix_discount_changes_discount ON discount_changes (discount_id, occurred_at DESC);

