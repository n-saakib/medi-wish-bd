spring:
  application:
    name: medi-wish
  main:
    banner-mode: off
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  datasource:
    # socketTimeout applies to every statement, not only health checks: no query may run longer than 3 s.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}?connectTimeout=2&socketTimeout=3
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      connection-timeout: 1000
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

server:
  tomcat:
    max-swallow-size: 8MB
  max-http-request-header-size: 16KB

app:
  notification:
    security:
      adapter: ${APP_NOTIFICATION_SECURITY_ADAPTER:disabled}
      timeout: ${APP_NOTIFICATION_SECURITY_TIMEOUT:PT5S}
  storage:
    provider: ${APP_STORAGE_PROVIDER:}
    local-root: ${APP_STORAGE_LOCAL_ROOT:}
    namespace: ${APP_STORAGE_NAMESPACE:}
  addresses:
    change-limits:
      per-week: 5
      per-month: 10
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  auth:
    access-token-lifetime: PT15M
    refresh-token-lifetime: P30D
    cookie:
      secure: ${APP_AUTH_COOKIE_SECURE:true}
    issuer: medi-wish
    audience: medi-wish-api
    jwt-secret: ${APP_AUTH_JWT_SECRET:}
    mfa:
      issuer: Medi Wish
      secret-key: ${APP_AUTH_MFA_SECRET_KEY:}
      restricted-session-lifetime: PT10M
      enrollment-lifetime: PT10M
      max-failed-attempts: 5
      attempt-window: PT15M
      lockout: PT15M
  provisioning:
    # Set only on the one-off operator command (web-application-type=none); never on a serving process.
    first-admin-username:

logging:
  structured:
    format:
      console: ecs
  level:
    # Connection errors can contain server-supplied values; health exposes only status.
    org.springframework.boot.jdbc.health: OFF
    com.zaxxer.hikari: OFF
    org.hibernate: ERROR
    liquibase: ERROR

# These libraries are enabled only in the compatibility startup test profile.
springdoc:
  api-docs:
    enabled: false
jobrunr:
  background-job-server:
    enabled: false
  dashboard:
    enabled: false
  miscellaneous:
    allow-anonymous-data-usage: false
